z hopes the cat’s international profile will make it easier to find funding for the next step—more science to learn more about the tilcayo and how to protect it.\n\nRead more at the link in bio.\n\nPhotos by @fernando.faciole\n\nVideos by @fernando.faciole and @joelsartore, Photo Ark","created_at":1793057557},"caption_is_edited":true,"carousel_media":[{"__typename":"XIGPolarisImageMedia","accessibility_caption":"Photo by National Geographic on October 26, 2026. May be an image of slow loris, big cat, tiger and text.","code":"De-TxXsFynW","display_uri":"https://scontent-dus1-1.cdninstagram.com/v/t51.82787-15/868670377_18712478236019133_8986840513922365950_n.jpg?stp=dst-jpg_e35_s640x640_tt6&fixture=1","original_height":1350,"original_width":1080,"image_versions2":{"candidates":[{"url":"https://scontent-dus1-1.cdninstagram.com/v/t51.82787-15/868670377_18712478236019133_8986840513922365950_n.jpg?stp=dst-jpg_e35_tt6&fixture=1"},{"url":"https://scontent-dus1-1.cdninstagram.com/v/t51.82787-15/868670377_18712478236019133_8986840513922365950_n.jpg?stp=dst-jpg_e35_p720x720_tt6&fixture=1"},{"url":"https://scontent-dus1-1.cdninstagram.com/v/t51.82787-15/868670377_18712478236019133_8986840513922365950_n.jpg?stp=dst-jpg_e35_p640x640_sh2.08_tt6&fixture=1"},{"url":"https://scontent-dus1-1.cdninstagram.com/v/t51.82787-15/868670377_18712478236019133_8986840513922365950_n.jpg?stp=dst-jpg_e35_p480x480_tt6&fixture=1"},{"url":"https://scontent-dus1-1.cdninstagram.com/v/t51.82787-15/868670377_18712478236019133_8986840513922365950_n.jpg?stp=dst-jpg_e35_p320x320_tt6&fixture=1"},{"url":"https://scontent-dus1-1.cdninstagram.com/v/t51.82787-15/868670377_18712478236019133_8986840513922365950_n.jpg?stp=dst-jpg_e35_p240x240_tt6&fixture=1"},{"url":"https://scontent-dus1-1.cdninstagram.com/v/t51.82787-15/868670377_18712478236019133_8986840513922365950_n.jpg?stp=c0.135.1080.1080a_dst-jpg_e35_s1080x1080_tt6&fixture=1"},{"url":"https://scontent-dus1-1.cdninstagram.com/v/t51.82787-15/868670377_18712478
